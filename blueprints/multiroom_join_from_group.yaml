# blueprints/multiroom_join_from_group.yaml
blueprint:
  name: Multiroom join from media_player group (group_members)
  description: >
    When audio is sent to a media_player entity that represents a speaker group
    (e.g. media_player.echos), automatically join its members for multiroom
    playback using the group_members attribute. Works with ESPHome and other
    integrations that expose group_members.
  domain: automation
  input:
    media_group:
      name: Media player group entity
      description: >
        The media_player entity that represents your speaker group
        (e.g. media_player.echos).
      selector:
        entity:
          filter:
            domain:
              - media_player

trigger:
  - trigger: state
    entity_id: !input media_group
    attribute: media_content_id
    from: null
    to: "*"
  - trigger: event
    event_type: call_service
    event_data:
      domain: media_player
      service: play_media
    context:
      entity_id: !input media_group

action:
  - variables:
      group_entity: !input media_group
      members_raw: >
        {{ state_attr(group_entity, 'group_members') or [] }}
      # Normalize to a clean list of entity ids
      members: >
        {% if members_raw is string %}
          {{ [members_raw] }}
        {% elif members_raw is iterable and members_raw is not mapping %}
          {{ members_raw | list }}
        {% else %}
          []
        {% endif %}
      leader: >
        {{ members[0] if members | length > 0 else None }}
      followers: >
        {{ members[1:] if members | length > 1 else [] }}
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ leader is not none and followers | length > 0 }}"
        sequence:
          - action: media_player.join
            target:
              entity_id: "{{ leader }}"
            data:
              group_members: "{{ followers }}"

mode: restart
